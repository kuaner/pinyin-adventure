<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FF9A3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>拼音闯关大冒险</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{height:100%}
body{
  font-family:ui-rounded,"SF Pro Rounded","PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","YouYuan",sans-serif;
  background:#FFEFD6;color:#4A3728;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
#wrap{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;background:#FFF8EE;position:relative;box-shadow:0 0 40px rgba(180,120,40,.15)}
.view{display:none;flex-direction:column;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.view.on{display:flex}

/* ---------- 通用按钮 ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:64px;border:none;border-radius:22px;
  font-family:inherit;font-size:22px;font-weight:800;color:#fff;cursor:pointer;
  background:#FF9A3D;box-shadow:0 5px 0 #E07B1A;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #E07B1A}
.btn.blue{background:#4FA3F7;box-shadow:0 5px 0 #2F7FD0}
.btn.blue:active{box-shadow:0 1px 0 #2F7FD0}
.btn.green{background:#3EC46D;box-shadow:0 5px 0 #26A052}
.btn.green:active{box-shadow:0 1px 0 #26A052}
.btn.purple{background:#9B6BF2;box-shadow:0 5px 0 #7A4BD1}
.btn.purple:active{box-shadow:0 1px 0 #7A4BD1}
.btn.ghost{background:#fff;color:#B58A4E;box-shadow:0 3px 0 #EBD9BC;border:2px solid #EBD9BC}
.btn.small{min-height:48px;font-size:18px;border-radius:16px}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.backbtn{flex:0 0 48px;height:48px;border:none;border-radius:16px;background:#fff;color:#B58A4E;font-size:24px;font-weight:800;
  box-shadow:0 3px 0 #EBD9BC;cursor:pointer;font-family:inherit}
.backbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #EBD9BC}
.topbar h2{flex:1;font-size:22px;font-weight:900;color:#7A4B1E}
.topbar .scorechip{background:#FFEDD2;color:#C77B1E;font-size:16px;font-weight:800;padding:6px 12px;border-radius:14px}

/* ---------- 首页 ---------- */
#v-home{align-items:center;justify-content:center;text-align:center;gap:14px}
.hero-emoji{font-size:84px;line-height:1;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.appname{font-size:36px;font-weight:900;color:#FF7A1A;letter-spacing:2px;text-shadow:0 3px 0 #FFE1B8}
.subtitle{font-size:16px;color:#B58A4E;font-weight:700;margin-bottom:10px}
.starsline{font-size:20px;font-weight:900;color:#E8A200;background:#FFF3D6;padding:8px 20px;border-radius:18px;margin-bottom:14px}
.menu .btn{margin-bottom:12px}
.menu{width:100%;max-width:340px}
.foot{font-size:12px;color:#CBB08A;margin-top:6px}

/* ---------- 关卡地图 ---------- */
#lvgrid{display:flex;flex-direction:column;gap:12px}
.lvlcard{display:flex;align-items:center;gap:14px;background:#fff;border-radius:24px;padding:14px 16px;cursor:pointer;
  box-shadow:0 4px 0 #F0DFC4;border:2px solid #F6EBD7;font-family:inherit;text-align:left;width:100%}
.lvlcard:active{transform:translateY(2px);box-shadow:0 2px 0 #F0DFC4}
.lvlcard.locked{opacity:.55;filter:grayscale(.6)}
.lvlcard .lvnum{flex:0 0 56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;background:#FFEDD2}
.lvlcard.boss .lvnum{background:#FFE3EF}
.lvlcard .lvinfo{flex:1;display:flex;flex-direction:column;gap:3px}
.lvlcard .lvname{font-size:20px;font-weight:900;color:#5C4326}
.lvlcard .lvsub{font-size:14px;color:#B99A6B;font-weight:700}
.lvlcard .lvstars{font-size:20px;letter-spacing:2px}
.bosstag{font-size:12px;color:#E84393;font-weight:900}

/* ---------- 答题页 ---------- */
.progresswrap{margin:4px 0 14px}
.pbar{height:14px;background:#F3E4C8;border-radius:8px;overflow:hidden}
.pfill{height:100%;width:0%;background:linear-gradient(90deg,#FFC53D,#FF9A3D);border-radius:8px;transition:width .3s}
.ptext{font-size:14px;color:#B99A6B;font-weight:800;margin-bottom:5px;display:flex;justify-content:space-between}
.qcard{background:#fff;border-radius:28px;padding:18px 16px 22px;box-shadow:0 5px 0 #F0DFC4;border:2px solid #F6EBD7;
  display:flex;flex-direction:column;align-items:center;gap:12px}
.qhint{font-size:18px;font-weight:800;color:#8A6A3E;text-align:center}
.glyphbox{display:flex;align-items:center;justify-content:center;min-height:130px;gap:12px}
.glyph{font-size:clamp(88px,25vw,120px);font-weight:800;line-height:1.1;color:#4A3728;
  background:#FFF6E3;border:4px solid #F0DFC4;border-radius:28px;padding:6px 26px;min-width:140px;text-align:center}
.glyph.soundonly{font-size:76px;background:#E8F3FF;border-color:#BBD9F7}
.qextra{font-size:15px;color:#B99A6B;font-weight:700;text-align:center;min-height:20px}
.ruletext{font-size:24px;font-weight:900;color:#5C4326;text-align:center;line-height:1.5;background:#FFF6E3;border-radius:20px;padding:14px}
.replaybtn{border:none;background:#FFEFD2;border-radius:50%;width:64px;height:64px;font-size:32px;cursor:pointer;box-shadow:0 3px 0 #F0D9A8;font-family:inherit}
.replaybtn:active{transform:translateY(2px)}
.bigsound{border:none;background:#E8F3FF;border:4px solid #BBD9F7;border-radius:32px;width:150px;height:130px;
  font-size:64px;cursor:pointer;box-shadow:0 5px 0 #BBD9F7;font-family:inherit;display:flex;align-items:center;justify-content:center}
.bigsound:active{transform:translateY(3px);box-shadow:0 2px 0 #BBD9F7}
.bigsound .bslabel{position:absolute;bottom:10px;font-size:14px;font-weight:900;color:#2F7FD0}
#optbox{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:10px}
.opt{min-height:88px;border:none;border-radius:22px;background:#fff;font-family:inherit;cursor:pointer;
  box-shadow:0 4px 0 #EADCC2;border:3px solid #F0E4CC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .06s}
.opt:active{transform:translateY(3px)}
.opt .og{font-size:52px;font-weight:800;color:#4A3728;line-height:1.15}
.opt .ob{font-size:13px;font-weight:800;color:#C4A876}
.opt.armed{border-color:#4FA3F7;background:#EFF7FF;box-shadow:0 4px 0 #BBD9F7}
.opt.armed .ob{color:#2F7FD0}
.opt.correct{border-color:#3EC46D;background:#EAFBF0;box-shadow:0 4px 0 #9ADFB4}
.opt.wrong{border-color:#F65E5E;background:#FFEDED;animation:shake .4s}
.opt.tf{min-height:104px}
.opt.tf .og{font-size:56px}
.opt.tf.yes .og{color:#2FA95C}
.opt.tf.no .og{color:#E8434F}
.opt.wide{grid-column:1 / -1;flex-direction:row;gap:14px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.subhint{font-size:14px;color:#C4A876;font-weight:700;text-align:center;margin-top:10px}

/* ---------- 反馈层 ---------- */
#fb{position:fixed;inset:0;background:rgba(255,248,238,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:60;padding:20px}
#fb.on{display:flex}
#fbicon{font-size:110px;line-height:1}
#fb.good #fbicon{animation:popin .35s ease}
#fb.bad #fbicon{animation:shake .4s}
#fbtext{font-size:30px;font-weight:900}
#fb.good #fbtext{color:#2FA95C}
#fb.bad #fbtext{color:#E8434F}
#fbdetail{display:flex;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:12px 20px;box-shadow:0 4px 0 #F0DFC4}
#fbdetail .glyph{font-size:64px;min-width:0;padding:4px 18px;border-width:3px}
#fbdetail .fdesc{font-size:17px;font-weight:800;color:#8A6A3E;max-width:200px;line-height:1.4}
#fbskip{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 28px);border:none;background:#F3E4C8;color:#8A6A3E;
  font-family:inherit;font-size:16px;font-weight:800;padding:10px 26px;border-radius:18px;cursor:pointer}
@keyframes popin{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.floatstar{position:absolute;font-size:34px;animation:floatup 1s ease forwards}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:1}100%{transform:translateY(-90px) scale(1.2);opacity:0}}

/* ---------- 结算页 ---------- */
#v-result{align-items:center;justify-content:center;text-align:center;gap:10px}
#rstars{display:flex;gap:12px;margin:8px 0}
.rstar{font-size:68px;opacity:.22;transform:scale(.85)}
.rstar.on{opacity:1;transform:scale(1);animation:starpop .55s ease both}
.rstar.on:nth-child(2){animation-delay:.25s}
.rstar.on:nth-child(3){animation-delay:.5s}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
#rtitle{font-size:34px;font-weight:900;color:#FF7A1A}
#rscore{font-size:20px;font-weight:800;color:#8A6A3E}
#rworst{font-size:16px;font-weight:800;color:#C77B1E;background:#FFEDD2;padding:8px 18px;border-radius:16px;max-width:320px}
#runlock{font-size:18px;font-weight:900;color:#2FA95C;animation:bob 1.6s ease-in-out infinite}
.rbtns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin-top:14px}

/* ---------- 闪卡 ---------- */
.ftabs{display:flex;gap:8px;margin-bottom:12px}
.ftab{flex:1;min-height:44px;border:none;border-radius:14px;background:#fff;color:#B99A6B;font-family:inherit;font-size:16px;font-weight:800;
  box-shadow:0 3px 0 #EBDDBE;cursor:pointer}
.ftab.on{background:#FF9A3D;color:#fff;box-shadow:0 3px 0 #E07B1A}
#deckinfo{font-size:14px;font-weight:800;color:#B99A6B;text-align:center;margin-bottom:10px}
#flashcard{background:#fff;border-radius:30px;min-height:380px;box-shadow:0 6px 0 #F0DFC4;border:3px solid #F6EBD7;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;cursor:pointer;position:relative}
#flashcard .fcglyph{font-size:120px;font-weight:800;line-height:1.1;color:#4A3728}
#flashcard .fchint{font-size:15px;color:#C4A876;font-weight:800}
#flashcard .fcbox{position:absolute;top:14px;right:16px;font-size:13px;font-weight:900;color:#fff;background:#C4A876;padding:4px 12px;border-radius:12px}
#flashcard .fcback{display:flex;flex-direction:column;align-items:center;gap:10px}
#flashcard .fcread{font-size:40px;font-weight:900;color:#FF7A1A}
#flashcard .fcword{font-size:30px;font-weight:900;color:#5C4326}
#flashcard .fcwp{font-size:17px;color:#B99A6B;font-weight:800}
#flashcard .fckj{font-size:18px;font-weight:800;color:#2FA95C;background:#EAFBF0;padding:8px 16px;border-radius:14px;text-align:center;line-height:1.4}
#flashcard .fcem{font-size:56px}
#rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.ratebtn{min-height:60px;border:none;border-radius:18px;font-family:inherit;font-size:17px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.ratebtn:active{transform:translateY(3px)}
.ratebtn.r1{background:#F65E5E;box-shadow:0 4px 0 #D13A3A}
.ratebtn.r2{background:#FFB020;box-shadow:0 4px 0 #D98F0A}
.ratebtn.r3{background:#3EC46D;box-shadow:0 4px 0 #26A052}
#flashnav{display:flex;gap:10px;margin-top:10px}

/* ---------- 专练 ---------- */
.pgroup{background:#fff;border-radius:24px;padding:16px;box-shadow:0 4px 0 #F0DFC4;border:2px solid #F6EBD7;margin-bottom:14px}
.pgroup h3{font-size:19px;font-weight:900;color:#5C4326;margin-bottom:4px}
.pgroup .gdesc{font-size:14px;color:#B99A6B;font-weight:700;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:2px solid #F0DFC4;background:#FFF6E3;color:#5C4326;font-family:inherit;font-size:22px;font-weight:900;
  padding:8px 18px;border-radius:16px;cursor:pointer;min-height:52px}
.chip:active{transform:translateY(2px)}

/* ---------- 历史 ---------- */
.hitem{background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 3px 0 #F0DFC4;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.hitem .ht{font-size:13px;color:#C4A876;font-weight:800;flex:1}
.hitem .hl{font-size:16px;font-weight:900;color:#5C4326;flex:1.4}
.hitem .hs{font-size:16px;font-weight:900;color:#E8A200}
.hempty{text-align:center;color:#CBB08A;font-weight:800;padding:40px 0;font-size:17px}

/* ---------- 辨析卡弹窗 ---------- */
.modal{position:fixed;inset:0;background:rgba(74,55,40,.45);display:none;align-items:center;justify-content:center;z-index:70;padding:20px}
.modal.on{display:flex}
.mcard{background:#FFF8EE;border-radius:28px;padding:22px 18px;max-width:360px;width:100%;box-shadow:0 8px 0 rgba(0,0,0,.12);position:relative}
.mclose{position:absolute;top:10px;right:12px;border:none;background:#F3E4C8;width:40px;height:40px;border-radius:14px;
  font-size:18px;font-weight:900;color:#8A6A3E;cursor:pointer;font-family:inherit}
.mtitle{font-size:22px;font-weight:900;color:#5C4326;text-align:center;margin-bottom:12px}
.mduo{display:flex;gap:12px;justify-content:center;margin-bottom:12px}
.mhalf{flex:1;background:#fff;border-radius:22px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 #F0DFC4}
.mhalf .mg{font-size:72px;font-weight:800;line-height:1.15}
.mhalf .mkj{font-size:14px;font-weight:800;color:#2FA95C;text-align:center;line-height:1.4}
.mhalf .msay{border:none;background:#FFEDD2;border-radius:12px;font-family:inherit;font-size:15px;font-weight:900;color:#C77B1E;padding:6px 14px;cursor:pointer}
.mtip{font-size:16px;font-weight:800;color:#8A6A3E;background:#fff;border-radius:16px;padding:10px 14px;text-align:center;line-height:1.5}

/* ---------- 探针横幅 ---------- */
#probe{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:99;
  background:#222;color:#7CFC98;font-family:Menlo,monospace;font-size:13px;font-weight:700;
  padding:10px 12px;border-radius:12px;text-align:center;opacity:.94}

/* ---------- 兜底提示 ---------- */
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(74,55,40,.92);color:#fff;
  font-size:15px;font-weight:800;padding:10px 20px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:80}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="wrap">

  <!-- 首页 -->
  <section id="v-home" class="view on">
    <div class="hero-emoji">🐣</div>
    <div class="appname">拼音闯关大冒险</div>
    <div class="subtitle">跟小鸡一起学拼音 · 专治 b d 分不清</div>
    <div class="starsline" id="homestars">⭐ 星星：0 颗</div>
    <div class="menu">
      <button class="btn" data-go="levels">🚩 闯关冒险</button>
      <button class="btn purple" data-go="pairs">⚔️ 易混对专练</button>
      <button class="btn blue" data-go="flash">🃏 闪卡复习</button>
      <button class="btn green" data-go="practice">🎯 自由练习</button>
      <button class="btn ghost" data-go="history">📜 历史成绩</button>
    </div>
    <div class="foot">全部数据保存在本机 · 无需联网</div>
  </section>

  <!-- 关卡地图 -->
  <section id="v-levels" class="view">
    <div class="topbar">
      <button class="backbtn" data-back="home">‹</button>
      <h2>选择关卡</h2>
    </div>
    <div id="lvgrid"></div>
  </section>

  <!-- 答题 -->
  <section id="v-quiz" class="view">
    <div class="topbar">
      <button class="backbtn" data-back="quit">✕</button>
      <h2 id="qtitle">关卡</h2>
      <div class="scorechip" id="qscore">得分 0</div>
    </div>
    <div class="progresswrap">
      <div class="ptext"><span id="qprog">第 1/10 题</span><span id="qkind"></span></div>
      <div class="pbar"><div class="pfill" id="pfill"></div></div>
    </div>
    <div class="qcard">
      <div class="qhint" id="qhint"></div>
      <div class="glyphbox" id="glyphbox"></div>
      <div class="qextra" id="qextra"></div>
      <div id="optbox"></div>
      <div class="subhint" id="subhint"></div>
    </div>
  </section>

  <!-- 结算 -->
  <section id="v-result" class="view">
    <div id="rstars"><span class="rstar">⭐</span><span class="rstar">⭐</span><span class="rstar">⭐</span></div>
    <div id="rtitle"></div>
    <div id="rscore"></div>
    <div id="rworst"></div>
    <div id="runlock"></div>
    <div class="rbtns">
      <button class="btn" id="rnext">下一关 ➜</button>
      <button class="btn blue" id="ragain">🔄 再玩一次</button>
      <button class="btn ghost" id="rhome">回主页</button>
    </div>
  </section>

  <!-- 闪卡 -->
  <section id="v-flash" class="view">
    <div class="topbar">
      <button class="backbtn" data-back="home">‹</button>
      <h2>闪卡复习</h2>
    </div>
    <div class="ftabs" id="ftabs">
      <button class="ftab on" data-cat="all">全部</button>
      <button class="ftab" data-cat="sm">声母</button>
      <button class="ftab" data-cat="ym">韵母</button>
      <button class="ftab" data-cat="zt">整体认读</button>
    </div>
    <div id="deckinfo"></div>
    <div id="flashcard">
      <div class="fcbox" id="fcbox">盒 1</div>
      <div id="fcinner"></div>
      <div class="fchint" id="fchint">点卡片翻面 👆</div>
    </div>
    <div id="rate">
      <button class="ratebtn r1" data-rate="1">还不会<br>今天再学</button>
      <button class="ratebtn r2" data-rate="2">快会了<br>明天再来</button>
      <button class="ratebtn r3" data-rate="3">会啦！<br>3天后再见</button>
    </div>
  </section>

  <!-- 易混对专练 -->
  <section id="v-pairs" class="view">
    <div class="topbar">
      <button class="backbtn" data-back="home">‹</button>
      <h2>易混对专练</h2>
    </div>
    <div id="pgroups"></div>
  </section>

  <!-- 自由练习 -->
  <section id="v-practice" class="view">
    <div class="topbar">
      <button class="backbtn" data-back="home">‹</button>
      <h2>自由练习</h2>
    </div>
    <div id="pgroups2" style="display:flex;flex-direction:column;gap:12px"></div>
  </section>

  <!-- 历史 -->
  <section id="v-history" class="view">
    <div class="topbar">
      <button class="backbtn" data-back="home">‹</button>
      <h2>历史成绩</h2>
    </div>
    <div id="histlist"></div>
    <button class="btn ghost small" id="hclear" style="margin-top:8px">清空记录</button>
  </section>

</div>

<!-- 辨析卡弹窗 -->
<div class="modal" id="pairModal">
  <div class="mcard">
    <button class="mclose" id="mclose">✕</button>
    <div class="mtitle" id="mtitle"></div>
    <div class="mduo" id="mduo"></div>
    <div class="mtip" id="mtip"></div>
  </div>
</div>

<!-- 反馈层 -->
<div id="fb">
  <div id="fbicon"></div>
  <div id="fbtext"></div>
  <div id="fbdetail" style="display:none"><div class="glyph" id="fbglyph"></div><div class="fdesc" id="fbdesc"></div></div>
  <button id="fbskip">继续 ›</button>
</div>

<div id="probe" style="display:none"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

var KEY='pinyin_app_v1';
var S={weights:{},stars:{},cards:{},hist:[],mute:false};
function loadS(){
  try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);
    if(o&&typeof o==='object'){S.weights=o.weights||{};S.stars=o.stars||{};S.cards=o.cards||{};S.hist=o.hist||[];S.mute=!!o.mute;}}
  }catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function getW(k){var r=S.weights[k];return r?r.w:1;}
function markResult(k,ok){
  var r=S.weights[k];if(!r){r=S.weights[k]={w:1,streak:0};}
  if(!ok){r.w=Math.min(r.w*2,8);r.streak=0;}
  else{r.streak++;if(r.streak>=2){r.w=Math.max(1,Math.floor(r.w/2));r.streak=0;}}
  save();
}
function todayStr(d){d=d||new Date();var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}

/* ================= 音效引擎（WebAudio 合成） ================= */
var AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
  return AC;
}
function tone(freq,delay,dur,type,vol){
  if(S.mute)return;var c=ac();if(!c)return;
  try{
    var t0=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(vol||0.16,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(c.destination);
    o.start(t0);o.stop(t0+dur+0.05);
  }catch(e){}
}
function sndOk(){tone(784,0,0.12);tone(1046,0.1,0.22);}          /* 叮咚 */
function sndNo(){tone(196,0,0.16,'square',0.09);tone(147,0.14,0.24,'square',0.09);} /* 嘟嘟 */
function sndStar(){tone(659,0,0.1);tone(784,0.09,0.1);tone(1046,0.18,0.3);}

/* ================= 读音引擎（Web Speech） ================= */
var zhVoice=null,noTTS=false;
function loadVoices(){
  if(!('speechSynthesis' in window)){noTTS=true;return;}
  try{
    var vs=window.speechSynthesis.getVoices();
    if(!vs||!vs.length){return;}
    var zh=vs.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf('zh')===0;});
    zhVoice=zh.filter(function(v){return v.lang.replace('_','-').toLowerCase()==='zh-cn';})[0]||zh[0]||null;
    noTTS=false;
  }catch(e){noTTS=true;}
}
if('speechSynthesis' in window){
  try{loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices;
    setTimeout(loadVoices,300);setTimeout(loadVoices,1200);}catch(e){}
}else{noTTS=true;}
function speak(txt){
  if(S.mute)return;
  if(noTTS||!('speechSynthesis' in window)){return;}
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(txt);
    u.lang='zh-CN';if(zhVoice)u.voice=zhVoice;
    u.rate=0.8;u.pitch=1.15;u.volume=1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function say(k){var L=LETTERS[k];if(L)speak(L.tts);}

  if(n===1)return true;

var QZ={tk:0,fbt:null};
function shuffle(arr){var a=arr.slice(),i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}
function wpick(items){var tot=0,i,r;for(i=0;i<items.length;i++)tot+=items[i].w;r=Math.random()*tot;for(i=0;i<items.length;i++){r-=items[i].w;if(r<=0)return items[i];}return items[items.length-1];}
function pairW(k,level){
  var w=getW(k),pi=PMAP[k];
  if(pi!==undefined){
    if(level.hot&&level.hot.indexOf(k)>=0)w*=3;          /* n/l 高压 */
    if(level.boss&&PAIRS[pi].grp==='mirror')w*=2;        /* 毕业关镜像高压 */
  }
  return w;
}
function pickKey(level,usedKeys){
  var items=[],covered={},i,k,l;
  if(level.pairs&&level.pairs.length){
    for(i=0;i<level.pairs.length;i++){k=level.pairs[i];covered[k.split('|')[0]]=1;covered[k.split('|')[1]]=1;items.push({k:k,w:pairW(k,level)});}
  }
  if(level.pool){
    for(i=0;i<level.pool.length;i++){l=level.pool[i];if(!covered[l])items.push({k:'L:'+l,w:getW('L:'+l)});}
  }
  if(!items.length)items=[{k:'L:'+level.pool[0],w:1}];
  var cand=null,n;
  for(var t=0;t<12;t++){
    cand=wpick(items).k;n=usedKeys.length;
    if(!(n>=2&&usedKeys[n-1]===cand&&usedKeys[n-2]===cand))return cand; /* 同对连续上限2次 */
  }
  return cand;
}
function partnerOf(letter){
  for(var i=0;i<PAIRS.length;i++){var p=PAIRS[i];
    if(p.a===letter)return p.b;if(p.b===letter)return p.a;}
  return null;
}
function sameCatOthers(letter,n,exclude,scope){

  if(scope&&scope.length){ /* 干扰项先取当前关卡字母池（符合学习顺序） */
    for(i=0;i<scope.length;i++){k=scope[i];
      if(LETTERS[k]&&LETTERS[k].cat===cat&&exclude.indexOf(k)<0&&pool.indexOf(k)<0)pool.push(k);}
  }
  if(pool.length<n){
    for(k in LETTERS){if(LETTERS[k].cat===cat&&exclude.indexOf(k)<0&&pool.indexOf(k)<0)pool.push(k);}
  }
  return shuffle(pool).slice(0,n);
}
function makeQ(level,key,type){
  var q={type:type,key:key},A,B,isPair=key.indexOf('|')>=0;
  if(isPair){var s=key.split('|');A=s[0];B=s[1];if(Math.random()<0.5){A=s[1];B=s[0];}}
  else{A=key.slice(2);B=partnerOf(A)||sameCatOthers(A,1,[A],level.pool)[0];}
  q.A=A;q.B=B;
  if(type==='listen'){
    q.opts=shuffle([A,B].concat(sameCatOthers(A,2,[A,B],level.pool)));q.ans=q.opts.indexOf(A);
    q.hint='听一听，选出你听到的拼音';
  }else if(type==='look'){
    q.opts=shuffle([A,B].concat(sameCatOthers(A,2,[A,B],level.pool)));q.ans=q.opts.indexOf(A);
    q.hint='点小喇叭听一听，哪个读音和它一样？';
  }else if(type==='ll'){
    q.same=Math.random()<0.5;q.sound=q.same?A:B;q.ans=q.same?0:1;
    q.hint='听到和看到的一样吗？';
  }else{
    q.true=Math.random()<0.5;q.stmt=q.true?LETTERS[A].kj:LETTERS[A].kjf;q.ans=q.true?0:1;
    q.hint='判断：这句话说得对吗？';
  }
  return q;
}
function buildQuestions(level){
  var mix=shuffle(['listen','listen','listen','look','look','ll','ll','ll','rule','rule']);
  var qs=[],keys=[],i;
  for(i=0;i<10;i++){var key=pickKey(level,keys);keys.push(key);qs.push(makeQ(level,key,mix[i]));}
  return qs;
}

function armLook(idx,btn){

function answer(idx){
  var q=QZ.q,ok=idx===q.ans,bs=el('optbox').children,i;

function stamp(){var d=new Date();function p(x){return x<10?'0'+x:''+x;}

function endQuiz(){
  QZ.done=true;
  var sc=QZ.score,stars=sc>=9?3:sc>=7?2:sc>=6?1:0;
  var lvNo=QZ.cfg.levelNo,unlockMsg='';
  if(lvNo){
    if(stars>(S.stars[lvNo]||0)){S.stars[lvNo]=stars;}
    save();
    if(stars>=1&&lvNo===8)unlockMsg='👑 毕业关「易混对大师」已解锁！';
    else if(stars>=1&&lvNo===9)unlockMsg='🎓 恭喜毕业！你就是易混对大师！';
    else if(stars>=1)unlockMsg='🎉 解锁下一关！';
  }
  var worst=null,wv=0,k;
  for(k in QZ.miss){if(QZ.miss[k]>0){var w=QZ.miss[k]*getW(k);if(w>wv){wv=w;worst=k;}}}
  var wlabel=worst?worst.replace('|','↔').replace('L:',''):'';
  S.hist.unshift({d:stamp(),lv:QZ.cfg.name,sc:sc,st:lvNo?stars:-1,wp:wlabel});

function buildDeck(){
  var keys=[],k;
  for(k in LETTERS){if(FC.cat==='all'||LETTERS[k].cat===FC.cat)keys.push(k);}

  keys.forEach(function(x){(dueToday(cardRec(x))?due:rest).push(x);});

  el('mclose').addEventListener('click',function(){el('pairModal').classList.remove('on');});
  el('pairModal').addEventListener('click',function(ev){
    if(ev.target===el('pairModal'))el('pairModal').classList.remove('on');
  });
  el('hclear').addEventListener('click',function(){
    if(confirm('只清空历史成绩，保留闯关进度和星星，确定吗？')){S.hist=[];save();renderHistory();}
  });
}

/* ================= 动态探针 =================
   ?probe=1 自动模拟点击：进第1关 → 点击正确选项 → 验证反馈层弹出、得分 0→1、权重写入 */
function probeRun(){
  var banner=el('probe');
  banner.style.display='block';
  banner.textContent='PROBE: 启动，进入第1关…';
  try{
    renderLevels();show('v-levels');
    setTimeout(function(){
      el('lv-1').click();
      setTimeout(function(){
        var q=QZ.q,opts=el('optbox').querySelectorAll('.opt');
        banner.textContent='PROBE: 点击正确选项#'+(q.ans+1)+'（题型 '+q.type+'）';
        opts[q.ans].click();
        var fbOn=el('fb').classList.contains('on');
        setTimeout(function(){
          banner.textContent='PROBE-OK JS存活 ✓ 反馈层即时弹出='+fbOn
            +' 得分 '+QZ.score+'/10 错题权重记录='+Object.keys(S.weights).length+'对';
        },1500);
      },800);
    },400);
  }catch(e){banner.textContent='PROBE-FAIL: '+(e&&e.message);}
}

/* ================= 启动 ================= */
function init(){
  loadS();
  bindAll();
  renderHome();
  var s=location.search;
  if(s.indexOf('probe')>=0&&s.indexOf('flash')>=0){setTimeout(probeFlash,500);}
  else if(s.indexOf('probe')>=0){setTimeout(probeRun,500);}
  else{
    var mo=s.match(/open=(\w+)/);
    if(mo){setTimeout(function(){openView(mo[1]);},400);}
  }
}
/* 视觉验收辅助：?open=levels/pairs/practice/history/result 直接渲染对应界面 */
function openView(v){
  if(v==='levels'){renderLevels();show('v-levels');}
  else if(v==='pairs'){renderPairs();show('v-pairs');}
  else if(v==='practice'){renderPractice();show('v-practice');}
  else if(v==='history'){renderHistory();show('v-history');}
  else if(v==='result'){renderResult(8,2,'🎉 解锁下一关！','b↔d',2);}
}
/* 闪卡探针：进入闪卡 → 翻面 → 验证背面渲染 */
function probeFlash(){
  var banner=el('probe');
  banner.style.display='block';
  try{
    renderFlash();show('v-flash');
    setTimeout(function(){
      var k=FC.deck[FC.idx];
      el('flashcard').click();
      setTimeout(function(){
        banner.textContent='PROBE-OK 闪卡 ✓ 牌堆='+FC.deck.length+'张 当前='+k+' 翻面='+(FC.flipped?'背面(口诀+例词)':'正面');
      },600);
    },400);
  }catch(e){banner.textContent='PROBE-FAIL: '+(e&&e.message);}
}
init();

})();
</script>
