name: Build & Deploy to Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_PAGES: 1

      # v2.9.4 起 Pages 运行于 legacy 模式（source=gh-pages 分支，推送后自动构建上线）。
      # 注意：迁到 legacy 是在一次误诊排查中完成的（当时把 deployments API 记录缺失 +
      # 本地构建未带 GITHUB_PAGES=1 的哈希差，误读成"部署管线失效、线上冻结"）；
      # sha1 复核证明 serving 一直正常。legacy 流已验证可用（run4 绿+双 sha1 一致），
      # 维持现状；如需切回 workflow 模式：PUT pages build_type=workflow + 恢复
      # actions/deploy-pages（必须带 environment: github-pages，环境白名单已含 v* tag 策略）。
      - name: Deploy to gh-pages (legacy Pages source)
        run: |
          cd dist
          git init -b gh-pages .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${GITHUB_SHA::8}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
